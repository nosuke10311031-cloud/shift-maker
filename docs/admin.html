<html lang="ja">

<style>
  :root{
    --bg:#f4f1ea;--paper:#fffdf8;--ink:#2b2724;--muted:#8a8378;--line:#e3ddd0;
    --accent:#d8602e;--accent-soft:#fbe9df;
    --maru:#2f9e6f;--maru-bg:#e3f3eb;--sankaku:#d99a26;--sankaku-bg:#fbf0d8;--batsu:#c2bcb1;--batsu-bg:#efece5;
    --weekend:#bb4d6e;--shadow:0 1px 2px rgba(43,39,36,.06),0 8px 24px rgba(43,39,36,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);
    background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;
    color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
  h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:30px;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
  h1 .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:18px}
  .card h2{font-family:'Zen Maru Gothic',sans-serif;font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2 .num{background:var(--ink);color:var(--paper);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  label.fl{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  input,select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=number]{width:72px}
  .btn{font-family:inherit;font-weight:700;font-size:14px;padding:9px 16px;border:none;border-radius:10px;background:var(--ink);color:var(--paper);cursor:pointer;transition:transform .08s,opacity .15s}
  .btn:hover{opacity:.9}.btn:active{transform:translateY(1px)}
  .btn.accent{background:var(--accent)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .member-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:6px 8px 6px 12px;border-radius:14px;font-size:13px;font-weight:500}
  .member-tag .nm{font-weight:700}
  .member-tag .emp{background:var(--maru-bg);color:var(--maru);border-radius:5px;padding:1px 4px;font-size:9px;font-weight:700}
  .member-tag .rename{border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:10px;font-weight:700;padding:2px 3px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .member-tag .consec{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:400;color:#a55a36}
  .member-tag .consec input{width:34px;padding:3px 4px;font-size:11px;border-radius:6px;text-align:center}
  .member-tag button.del{border:none;background:rgba(0,0,0,.08);color:inherit;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
  .grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:6px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
  thead th{background:var(--paper);position:sticky;top:0;z-index:2;font-weight:700;padding:7px 9px}
  .namecol{position:sticky;left:0;background:var(--paper);z-index:1;text-align:left;padding:7px 12px;font-weight:500;min-width:100px}
  thead .namecol{z-index:3}
  .dayhead{font-size:12px;min-width:42px}
  .dayhead small{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .dayhead.we{color:var(--weekend)}
  .pref-cell{font-weight:700;width:48px;font-size:15px;user-select:none;vertical-align:middle;padding:2px 1px;text-align:center}
  .pcell-mark{cursor:pointer;line-height:1.15}
  .pcell-time{margin-top:1px}
  .pcell-time .tp{display:block;width:100%}
  .pcell-time .tp-btn{width:100%;padding:1px 1px;font-size:9px;text-align:center;min-width:0}
  .mem-name{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
  .mp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:#2b2724;font-weight:500}
  .mp-row input{width:64px;padding:5px 6px;font-size:13px;border-radius:8px;text-align:center}
  .pref-maru{color:var(--maru);background:var(--maru-bg)}
  .pref-double{color:#18754d;background:#d5efe2}
  .pref-sankaku{color:var(--sankaku);background:var(--sankaku-bg)}
  .pref-batsu{color:var(--batsu);background:var(--batsu-bg)}
  .demand-value{display:block;text-align:center;padding:6px 2px;font-size:13px;font-weight:700;color:var(--ink)}
  .plan-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px;margin-top:12px}
  .plan-block{min-width:0;border-left:3px solid var(--line);padding:2px 0 2px 10px}
  .plan-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
  .plan-title{font-family:'Zen Maru Gothic',sans-serif;font-size:14px;font-weight:700}
  .plan-total{font-size:11px;color:var(--muted);white-space:nowrap}
  .plan-row{display:grid;grid-template-columns:minmax(74px,1fr) 54px 25px;gap:5px;align-items:center;margin-top:5px}
  .plan-row .tp,.plan-row .tp-btn{width:100%}
  .plan-row .tp-btn{text-align:center;padding:6px 4px}
  .plan-count{width:54px!important;min-width:0;padding:6px 4px;text-align:center}
  .plan-del{width:25px;height:25px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
  .plan-del:disabled{opacity:.3;cursor:default}
  .plan-add{margin-top:7px;border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:2px}
  .plan-note{margin-top:10px;padding:8px 10px;border-left:3px solid var(--sankaku);background:var(--sankaku-bg);font-size:11px;color:#755713}
  .stat{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
  .stat .b{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px}
  .stat .b b{font-family:'Zen Maru Gothic';font-size:16px;display:block}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .fill-stack,.clear-stack,.time-stack{display:flex;flex-direction:column;gap:4px}
  .fill-stack .btn,.clear-stack .btn,.time-stack .btn{width:100%}
  .time-stack{border-left:1px solid var(--line);padding-left:10px}
  .shift-guide{display:grid;grid-template-columns:auto auto;align-self:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#faf7f0;font-size:9px;line-height:1.25}
  .shift-guide dt,.shift-guide dd{padding:3px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
  .shift-guide dt{font-weight:700;background:#f2ede3;border-right:1px solid var(--line)}
  .shift-guide dd{font-variant-numeric:tabular-nums}
  .shift-guide dt:nth-last-of-type(1),.shift-guide dd:last-child{border-bottom:none}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
  .save-note{font-size:11px;color:var(--muted)}
  /* summary */
  .sum-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .sum-table th{font-size:11px;color:var(--muted);font-weight:500;padding:6px 10px;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap}
  .sum-table td{padding:6px 10px;border-bottom:1px solid #f0ece2}
  .sum-table td.n{text-align:center;font-variant-numeric:tabular-nums}
  .sum-table .big{font-family:'Zen Maru Gothic';font-weight:700;font-size:15px}
  .warn{color:var(--accent);font-size:11px}
  .error-cell{min-width:150px;text-align:left!important;white-space:normal!important;vertical-align:top}
  .shift-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .shift-title-row h2{margin-bottom:14px}
  .special-overflow{margin-left:auto;max-width:480px;padding:8px 10px;border:1px solid #e0a3a3;border-radius:9px;background:#fff0f0;color:#a32626;font-size:11px;font-weight:700;line-height:1.55}
  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px;width:100%;min-width:0}
  .cal-head{font-size:12px;font-weight:700;text-align:center;padding:4px 0;color:var(--muted)}
  .cal-head.we{color:var(--weekend)}
  .cal-cell{border:1px solid var(--line);border-radius:9px;background:var(--paper);min-width:0;min-height:54px;padding:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal-cell.we{background:#fdf7f5}
  .cal-cell.blank{background:transparent;border:none}
  .cal-date{font-family:'Zen Maru Gothic';font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .cal-date .cap{font-size:10px;color:var(--muted);font-weight:400}
  .cal-date .over{color:var(--accent)}
  .cal-date.short{background:#fce9a3;border-radius:4px}
  .mrow{display:grid;grid-template-columns:minmax(42px,1fr) 14px 46px 14px 52px;gap:2px;align-items:center;font-size:11px;padding:2px 0;cursor:pointer;border-radius:5px}
  .avt{font-size:10px;color:var(--accent);font-weight:700;flex:none;white-space:nowrap}
  .avt2{font-size:10px;color:var(--accent);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden}
  .mrow .dim{color:#cdc6b8;font-weight:400}
  .mrow .pf{text-align:center;font-weight:700;border-radius:3px}
  .mrow .mk{text-align:center;font-weight:700}
  .wt{min-width:0}
  .wt .tp{display:block;width:100%}
  .wt .tp-btn{width:100%;padding:3px 1px;font-size:10px;text-align:center}
  /* 完成カレンダー（全幅・コンパクト・スクショ向き） */
  .mcell{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:10px;padding:2px 1px;cursor:pointer;border-radius:4px;line-height:1.35}
  .mcell.out{opacity:.4}
  .mck{font-weight:700;flex:none;font-size:11px}
  .mnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .mnm.cmaru,.mnm.csankaku,.mnm.cbatsu{color:var(--maru);font-weight:600}
  .mtw{width:100%}
  .mtw .tp{display:block;width:100%}
  .mtw .tp-btn{width:100%;padding:2px 1px;font-size:9px;text-align:center}
  .avh{width:100%;font-size:9px;color:var(--sankaku);padding-left:13px}
  /* カレンダー各マスの5列ミニ行 */
  .mini-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.35fr) minmax(0,1.25fr) minmax(0,.35fr) minmax(0,1.25fr);gap:0;align-items:stretch;font-size:8px;line-height:1.25;min-height:14px;padding:0;border-top:1px solid #eee7da;border-left:1px solid #eee7da}
  .mini-row>span{min-width:0;border-right:1px solid #eee7da;border-bottom:1px solid #eee7da;padding:1px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .mini-row.miss{background:#fdf3ee}
  .mini-row .mnm{white-space:nowrap;overflow:hidden;font-weight:600;justify-content:flex-start}
  .mini-row .mnm.cmaru,.mini-row .mnm.csankaku,.mini-row .mnm.cbatsu{color:var(--maru);font-weight:600}
  .mini-row .mpf{text-align:center;font-weight:700}
  .mini-row .mpf.cmaru{color:var(--maru)}.mini-row .mpf.csankaku{color:var(--sankaku)}.mini-row .mpf.cbatsu{color:var(--batsu)}
  .mini-row .mav{font-size:8px;color:var(--accent);text-align:center;overflow:hidden;white-space:nowrap}
  .mini-row .mak{text-align:center;font-weight:700;cursor:pointer}
  .mini-row .mwt{min-width:0;overflow:hidden;text-align:center}
  .mini-row .mwt .tp{display:block;width:100%}
  .mini-row .mwt .tp-btn{width:100%;height:100%;min-height:12px;padding:0 1px;font-size:8px;line-height:1.1}
  .mini-row .mwt .dim,.mini-row .mav.dim{color:#cdc6b8}
  .mini-row .wishfill{background:#fcebdd}
  .mini-row .workfill{background:#f6c6a0}
  .mini-row .mwt.workfill .tp-btn{background:transparent}
  .mini-row .lockfill{background:#bcd3f0}
  .mini-row .mwt.lockfill .tp-btn{background:transparent}
  .cf-wrap{position:relative;display:inline-block}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef,useLayoutEffect} = React;
const store={load(){try{const r=localStorage.getItem('shiftmaker_v3');return r?JSON.parse(r):null}catch(e){return null}},save(s){try{localStorage.setItem('shiftmaker_v3',JSON.stringify(s))}catch(e){}}};
const WD=['日','月','火','水','木','金','土'];
const isWeekend=(dow)=>dow===5||dow===6||dow===0;            // 金土日
const uid=()=>Math.random().toString(36).slice(2,9);
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const WEIGHT={'◯':1,'△':0.5,'×':0};
const dateKey=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const nthWeekday=(y,m,dow,n)=>{const first=new Date(y,m-1,1).getDay();return 1+((7+dow-first)%7)+(n-1)*7;};
const equinoxDay=(y,spring)=>{
  if(y<2000||y>2099)return 0;
  const base=spring?20.8431:23.2488;
  return Math.floor(base+0.242194*(y-1980)-Math.floor((y-1980)/4));
};
// 現行の祝日法に基づく日本の祝日・休日。2000〜2099年に対応。
function japaneseHolidays(y){
  const out={};
  if(y<2000||y>2099)return out;
  const add=(m,d,name)=>{out[dateKey(y,m,d)]=name;};
  add(1,1,'元日');
  add(1,nthWeekday(y,1,1,2),'成人の日');
  add(2,11,'建国記念の日');
  if(y>=2020)add(2,23,'天皇誕生日');
  else if(y<=2018)add(12,23,'天皇誕生日');
  add(3,equinoxDay(y,true),'春分の日');
  add(4,29,y>=2007?'昭和の日':'みどりの日');
  add(5,3,'憲法記念日');add(5,4,y>=2007?'みどりの日':'国民の休日');add(5,5,'こどもの日');
  if(y===2020){add(7,23,'海の日');add(7,24,'スポーツの日');add(8,10,'山の日');}
  else if(y===2021){add(7,22,'海の日');add(7,23,'スポーツの日');add(8,8,'山の日');}
  else{
    add(7,y>=2003?nthWeekday(y,7,1,3):20,'海の日');
    if(y>=2016)add(8,11,'山の日');
    add(10,nthWeekday(y,10,1,2),y>=2020?'スポーツの日':'体育の日');
  }
  add(9,y>=2003?nthWeekday(y,9,1,3):15,'敬老の日');
  add(9,equinoxDay(y,false),'秋分の日');
  add(11,3,'文化の日');add(11,23,'勤労感謝の日');
  if(y===2019){add(5,1,'天皇の即位の日');add(10,22,'即位礼正殿の儀');}

  // 祝日に挟まれた平日を「国民の休日」にする。
  for(let t=new Date(y,0,2);t.getFullYear()===y;t.setDate(t.getDate()+1)){
    const k=dateKey(y,t.getMonth()+1,t.getDate());
    if(out[k])continue;
    const prev=new Date(t);prev.setDate(t.getDate()-1);
    const next=new Date(t);next.setDate(t.getDate()+1);
    if(out[dateKey(y,prev.getMonth()+1,prev.getDate())]&&out[dateKey(y,next.getMonth()+1,next.getDate())])out[k]='国民の休日';
  }
  // 日曜の祝日は、その後で最初の祝日ではない日を振替休日にする。
  Object.keys({...out}).sort().forEach(k=>{
    const p=k.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);
    if(dt.getDay()!==0)return;
    do{dt.setDate(dt.getDate()+1);}while(out[dateKey(dt.getFullYear(),dt.getMonth()+1,dt.getDate())]);
    if(dt.getFullYear()===y)out[dateKey(y,dt.getMonth()+1,dt.getDate())]='振替休日';
  });
  return out;
}
// 提出コードのエンコード/デコード（日本語対応Base64）
const encodeSubmission=(obj)=>{try{const j=JSON.stringify(obj);return btoa(String.fromCharCode(...new TextEncoder().encode(j)));}catch(e){return '';}};
const decodeSubmission=(str)=>{try{const j=new TextDecoder().decode(Uint8Array.from(atob(str.trim()),c=>c.charCodeAt(0)));return JSON.parse(j);}catch(e){return null;}};
const packShareTime=(t)=>String(t||'').replace(':','');
const packSharePref=(p)=>p==='◯'?'1':p==='△'?'2':'0';
const PACK_CHARS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
const packSmall=(n)=>PACK_CHARS[n]||'';
const packShareTime2=(t)=>{
  const a=String(t||'').split(':').map(Number);
  if(a.length<2||!isFinite(a[0])||!isFinite(a[1]))return '';
  const q=Math.max(0,Math.min(95,Math.round((a[0]*60+a[1])/15)));
  return packSmall(Math.floor(q/64))+packSmall(q%64);
};
const packShareDayTime=(d,t)=>packSmall(d)+packShareTime2(t);

// ===== 共通：iPhoneタイマー風ホイール =====
const HOURS=Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const MINS=['00','15','30','45'];
const WH=38; // 1項目の高さ
function Wheel({items,value,onChange}){
  const ref=useRef(null);
  const to=useRef(null);
  useEffect(()=>{const i=items.indexOf(value);if(ref.current&&i>=0)ref.current.scrollTop=i*WH;},[]);
  const onScroll=()=>{
    clearTimeout(to.current);
    to.current=setTimeout(()=>{
      if(!ref.current)return;
      let i=Math.round(ref.current.scrollTop/WH);
      i=Math.max(0,Math.min(items.length-1,i));
      ref.current.scrollTop=i*WH;
      if(items[i]!==value)onChange(items[i]);
    },110);
  };
  const tap=(it)=>{const i=items.indexOf(it);if(ref.current)ref.current.scrollTo({top:i*WH,behavior:'smooth'});onChange(it);};
  return (
    <div className="wheel" ref={ref} onScroll={onScroll}>
      <div className="wpad"></div>
      {items.map(it=><div key={it} className={"witem"+(it===value?' sel':'')} onClick={()=>tap(it)}>{it}</div>)}
      <div className="wpad"></div>
    </div>
  );
}

// ===== 共通：時間選択ピッカー（タップで開く・15分刻み・決定ボタン付き） =====
function TimePicker({value,onChange,disabled,suffix,initialValue,minHour=0,allowClear=true}){
  const [open,setOpen]=useState(false);
  const [h,setH]=useState('17');
  const [m,setM]=useState('00');
  const [pos,setPos]=useState({top:0,left:0});
  const btnRef=useRef(null);
  const hourItems=HOURS.filter(x=>parseInt(x)>=minHour);
  useEffect(()=>{const a=(value||initialValue||'17:00').split(':');setH(a[0]);setM(a[1]);},[value,initialValue,open]);
  const label=value?(value+(suffix||'')):'--:--';
  const openPicker=()=>{
    if(disabled)return;
    const a=(value||initialValue||'17:00').split(':');setH(a[0]);setM(a[1]);
    const r=btnRef.current.getBoundingClientRect();
    const W=Math.min(300,window.innerWidth*0.92);
    const PH=235;
    let left=r.left; if(left+W>window.innerWidth-8)left=window.innerWidth-W-8; if(left<8)left=8;
    let top=r.bottom+6; if(top+PH>window.innerHeight-8)top=Math.max(8,r.top-PH-6);
    setPos({top,left});setOpen(true);
  };
  return (
    <span className="tp" onClick={e=>e.stopPropagation()}>
      <button ref={btnRef} type="button" className={"tp-btn"+(value?' has':'')} disabled={disabled}
        onClick={()=>{open?setOpen(false):openPicker();}}>{disabled?'—':label}</button>
      {open&&!disabled&&(<>
        <div className="tp-ov" onClick={()=>setOpen(false)}></div>
        <div className="tp-pop" style={{top:pos.top,left:pos.left}}>
          <div className="tp-ttl">時刻を選択（上下にスライド・15分刻み）</div>
          <div className="tp-wheels">
            <div className="tp-band"></div>
            <Wheel items={hourItems} value={h} onChange={setH}/>
            <span className="tp-colon">:</span>
            <Wheel items={MINS} value={m} onChange={setM}/>
          </div>
          <div className="tp-actions">
            {allowClear&&<button type="button" className="clr" onClick={()=>{onChange('');setOpen(false);}}>クリア</button>}
            <button type="button" className="ok" onClick={()=>{onChange(h+':'+m);setOpen(false);}}>決定</button>
          </div>
        </div>
      </>)}
    </span>
  );
}

// ===== 割り当てアルゴリズム =====
// 公平の目標（最大剰余法＋前後半ソフト）を作る純粋関数。autoFill とスコア評価で共有する。
function buildTargets(state){
  const {year,month,members,prefs}=state;
  const dim=daysInMonth(year,month);
  const holidays=japaneseHolidays(year);
  const days=[];
  for(let d=1;d<=dim;d++){const dow=new Date(year,month-1,d).getDay();const holiday=holidays[dateKey(year,month,d)]||'';days.push({d,dow,holiday,we:isWeekend(dow)||!!holiday});}
  const getPref=(mid,d)=>(prefs[mid]&&prefs[mid][d])||'×';
  const getDemand=(d)=>workPlanTotal(workPlanForDay(state,days[d-1]));
  const half=(d)=>d<=Math.ceil(dim/2)?'A':'B';

  // ---- プール別の目標（最大剰余法）----
  const poolTarget={weekday:{},weekend:{}};
  ['weekday','weekend'].forEach(pool=>{
    const pd=days.filter(x=>pool==='weekend'?x.we:!x.we);
    let slots=0;pd.forEach(x=>{const w=members.filter(m=>getPref(m.id,x.d)!=='×').length;slots+=Math.min(getDemand(x.d,x.we),w);});
    const wish={},cap={};
    members.forEach(m=>{let w=0,c=0;pd.forEach(x=>{const p=getPref(m.id,x.d);w+=WEIGHT[p];if(p!=='×')c++;});wish[m.id]=w;cap[m.id]=c;});
    const totalWish=members.reduce((s,m)=>s+wish[m.id],0);
    const ratio=totalWish>0?slots/totalWish:0;
    const raw={};let used=0;
    members.forEach(m=>{raw[m.id]=wish[m.id]*ratio;poolTarget[pool][m.id]=Math.min(Math.floor(raw[m.id]),cap[m.id]);used+=poolTarget[pool][m.id];});
    let rem=slots-used;
    // 余りは「小数点以下が大きい人」から1つずつ（上限まで）
    const byFrac=[...members].sort((a,b)=>((raw[b.id]-Math.floor(raw[b.id]))-(raw[a.id]-Math.floor(raw[a.id])))||(Math.random()-.5));
    for(const m of byFrac){if(rem<=0)break;if(poolTarget[pool][m.id]<cap[m.id]){poolTarget[pool][m.id]++;rem--;}}
  });
  const totalTarget={};members.forEach(m=>{const t=poolTarget.weekday[m.id]+poolTarget.weekend[m.id];totalTarget[m.id]=(m.maxDays&&m.maxDays>0)?Math.min(t,m.maxDays):t;});

  // ---- 前後半の目標（出せる日数の比・ソフト）----
  const halfTarget={A:{},B:{}};
  members.forEach(m=>{
    let aw=0,bw=0;days.forEach(x=>{if(getPref(m.id,x.d)!=='×')(half(x.d)==='A'?aw++:bw++);});
    const tot=aw+bw;
    halfTarget.A[m.id]=tot>0?totalTarget[m.id]*aw/tot:0;
    halfTarget.B[m.id]=totalTarget[m.id]-halfTarget.A[m.id];
  });
  return {dim,days,getPref,getDemand,half,poolTarget,totalTarget,halfTarget};
}

// 目標に沿って1解を作る。連勤禁止は絶対。手入力(placed)・確定(confM/confD)は保持。targets 省略時は内部生成。
function autoFill(state, targets){
  const {members,placed,confM,confD}=state;
  targets=targets||buildTargets(state);
  const {dim,days,getPref,getDemand,half,poolTarget,totalTarget,halfTarget}=targets;
  const isPlaced=(mid,d)=>!!(placed[d]&&placed[d][mid]);
  const isConfM=(mid)=>!!(confM&&confM[mid]);
  const isConfD=(dd)=>!!(confD&&confD[dd]);

  // 手入力を起点に
  const result={};days.forEach(x=>result[x.d]=members.filter(m=>isPlaced(m.id,x.d)).map(m=>m.id));

  // 連勤禁止（絶対）
  const servedOn=(mid,d)=>(result[d]||[]).includes(mid);
  const wouldExceed=(mid,d,N)=>{if(!N||N<1)return false;let len=1,p=d-1,q=d+1;while(p>=1&&servedOn(mid,p)){len++;p--;}while(q<=dim&&servedOn(mid,q)){len++;q++;}return len>=N;};
  const noConsec=(mid)=>{const m=members.find(x=>x.id===mid);return m&&m.noConsec?m.noConsec:0;};
  // 最大勤務日数（絶対・連勤と同格）。0＝制限なし。
  const maxDaysOf=(mid)=>{const m=members.find(x=>x.id===mid);return m&&m.maxDays?m.maxDays:0;};

  // ---- 現在の採用数（手入力を反映）----
  const apool={weekday:{},weekend:{}},ahalf={A:{},B:{}};
  members.forEach(m=>{apool.weekday[m.id]=0;apool.weekend[m.id]=0;ahalf.A[m.id]=0;ahalf.B[m.id]=0;});
  days.forEach(x=>{const pl=x.we?'weekend':'weekday';const h=half(x.d);result[x.d].forEach(mid=>{apool[pl][mid]++;ahalf[h][mid]++;});});
  const ratioOf=(v,t)=>t>0?v/t:900+v;

  // ---- 日の処理順：選択の余地がない日（応募≤募集）から ----
  const order=[...days].sort((a,b)=>{
    const sa=members.filter(m=>getPref(m.id,a.d)!=='×').length-getDemand(a.d,a.we);
    const sb=members.filter(m=>getPref(m.id,b.d)!=='×').length-getDemand(b.d,b.we);
    return (sa-sb)||(Math.random()-.5);
  });

  order.forEach(x=>{
    if(isConfD(x.d))return;
    const need=getDemand(x.d,x.we);const pool=x.we?'weekend':'weekday';const h=half(x.d);
    const pick=result[x.d];
    const addFrom=(pref)=>{
      const cands=members.filter(m=>getPref(m.id,x.d)===pref&&!isConfM(m.id)&&!pick.includes(m.id)&&!wouldExceed(m.id,x.d,noConsec(m.id))&&!(maxDaysOf(m.id)>0&&(apool.weekday[m.id]+apool.weekend[m.id])>=maxDaysOf(m.id)));
      cands.sort((a,b)=>
        (ratioOf(apool[pool][a.id],poolTarget[pool][a.id])-ratioOf(apool[pool][b.id],poolTarget[pool][b.id]))
        ||(ratioOf(ahalf[h][a.id],halfTarget[h][a.id])-ratioOf(ahalf[h][b.id],halfTarget[h][b.id]))
        ||(Math.random()-.5));
      for(const m of cands){if(pick.length>=need)break;pick.push(m.id);apool[pool][m.id]++;ahalf[h][m.id]++;}
    };
    addFrom('◯');
    if(pick.length<need)addFrom('△');
    result[x.d]=pick;
  });

  const out={};
  days.forEach(x=>{if(result[x.d]&&result[x.d].length){out[x.d]={};result[x.d].forEach(mid=>out[x.d][mid]=true);}});
  return out;
}

// 解(out)を評価。返り値は小さいほど良い辞書式タプル [不足, 公平ズレ, 前後半ズレ, △使用]。
// 手入力・確定セルは全試行で不変＝定数オフセットなので best 選択には影響しない。
function scoreFill(state, out, targets){
  const {members}=state;
  const {days,getPref,getDemand,half,totalTarget,halfTarget}=targets;
  let shortfall=0, triUsed=0;
  const tot={},hA={},hB={};
  members.forEach(m=>{tot[m.id]=0;hA[m.id]=0;hB[m.id]=0;});
  days.forEach(x=>{
    const dm=out[x.d]||{};
    let cnt=0;
    members.forEach(m=>{
      if(dm[m.id]){cnt++;tot[m.id]++;(half(x.d)==='A'?hA:hB)[m.id]++;if(getPref(m.id,x.d)==='△')triUsed++;}
    });
    const need=getDemand(x.d,x.we);
    if(cnt<need)shortfall+=need-cnt;
  });
  let fairnessDev=0, halfDev=0;
  members.forEach(m=>{
    fairnessDev+=Math.abs(tot[m.id]-totalTarget[m.id]);
    halfDev+=Math.abs(hA[m.id]-halfTarget.A[m.id])+Math.abs(hB[m.id]-halfTarget.B[m.id]);
  });
  return [shortfall, fairnessDev, halfDev, triUsed];
}

// 辞書式 a<b（不足＞公平＞前後半＞△ の優先順位）。重み付き和にしたければここを差し替える。
function lexLess(a,b){
  for(let i=0;i<a.length;i++){if(a[i]<b[i])return true;if(a[i]>b[i])return false;}
  return false;
}

// Best-of-N：同じ目標で autoFill を N 回回し、最良スコアの解を残す。構成上、最悪でも単発と同等。
function autoFillBest(state, N){
  N=N||300;
  const targets=buildTargets(state);
  let best=null,bestScore=null;
  for(let i=0;i<N;i++){
    const out=autoFill(state,targets);
    const sc=scoreFill(state,out,targets);
    if(best===null||lexLess(sc,bestScore)){best=out;bestScore=sc;}
  }
  return best||{};
}

// ===== 出勤時間の自動割り当て =====
const DEFAULT_WORK_PLANS={
  weekday:[{time:'17:00',count:4},{time:'18:00',count:2}],
  friday:[{time:'15:30',count:3},{time:'17:00',count:1},{time:'17:30',count:1}],
  saturday:[{time:'15:30',count:3},{time:'16:00',count:1},{time:'17:00',count:2}],
  sunday:[{time:'15:00',count:3},{time:'17:00',count:2},{time:'17:30',count:1}]
};
const PLAN_TYPES=['weekday','friday','saturday','sunday'];
const PLAN_LABELS={weekday:'平日（月〜木）',friday:'金',saturday:'土・祝',sunday:'日'};
const cloneDefaultPlans=()=>Object.fromEntries(PLAN_TYPES.map(type=>[type,DEFAULT_WORK_PLANS[type].map(row=>({...row}))]));
const normalizeWorkPlans=(raw)=>{
  const defaults=cloneDefaultPlans(),out={};
  PLAN_TYPES.forEach(type=>{
    const hasRows=!!(raw&&Object.prototype.hasOwnProperty.call(raw,type)&&Array.isArray(raw[type]));
    const rows=hasRows?raw[type]:defaults[type];
    const valid=rows.map(row=>({time:String(row.time||''),count:Math.max(1,parseInt(row.count)||1)}))
      .filter(row=>/^\d{2}:\d{2}$/.test(row.time))
      .sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
    out[type]=hasRows?valid:defaults[type];
  });
  return out;
};
const validateWorkPlans=(plans)=>{
  for(const type of PLAN_TYPES){
    const rows=plans&&plans[type];
    if(!Array.isArray(rows)||!rows.length)return `${PLAN_LABELS[type]}の募集時間がありません。1つ以上設定してください。`;
    const seen=new Set();
    for(const row of rows){
      if(timeToMinutes(row.time)<15*60)return `${PLAN_LABELS[type]}の時刻は15:00以降にしてください。`;
      if(!Number.isInteger(Number(row.count))||Number(row.count)<1)return `${PLAN_LABELS[type]}の人数は1名以上にしてください。`;
      if(seen.has(row.time))return `${PLAN_LABELS[type]}の${row.time}は重複しています。`;
      seen.add(row.time);
    }
  }
  return '';
};
const timeToMinutes=(v)=>{
  const p=String(v||'').split(':').map(Number);
  return p.length===2&&Number.isFinite(p[0])&&Number.isFinite(p[1])?p[0]*60+p[1]:0;
};
const minutesToTime=(v)=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
const planTypeForDay=(x)=>{
  if(x.holiday)return 'saturday';
  if(x.dow===0)return 'sunday';
  if(x.dow===5)return 'friday';
  if(x.dow===6)return 'saturday';
  return 'weekday';
};
const workPlanForDay=(state,x)=>(state.workPlans&&state.workPlans[planTypeForDay(x)])||DEFAULT_WORK_PLANS[planTypeForDay(x)];
const workPlanTotal=(rows)=>(rows||[]).reduce((sum,row)=>sum+(parseInt(row.count)||0),0);
const formatWorkPlan=(rows)=>(rows||[]).map(row=>`${row.time}−${row.count}名`).join(' ／ ');
const workSlotsForDay=(state,x)=>{
  const out=[];
  workPlanForDay(state,x).forEach(row=>{for(let i=0;i<row.count;i++)out.push(row.time);});
  return out;
};
const fairnessPool=(x)=>planTypeForDay(x)==='weekday'?'weekday':'weekend';
const fairnessBand=(pool,time)=>timeToMinutes(time)<=16*60?'first':'second';

// mode: remaining=入力済み時間を保持 / unconfirmed=確定時間だけ保持
function assignWorkTimes(state, mode){
  const planError=validateWorkPlans(state.workPlans);
  if(planError)return {error:planError};
  const {year,month,members}=state;
  const holidays=japaneseHolidays(year);
  const dim=daysInMonth(year,month);
  const days=[];
  for(let d=1;d<=dim;d++){
    const dow=new Date(year,month-1,d).getDay();
    const holiday=holidays[dateKey(year,month,d)]||'';
    days.push({d,dow,holiday});
  }
  const isIn=(d,mid)=>!!(state.placed&&state.placed[d]&&state.placed[d][mid]);
  const isConf=(d,mid)=>!!((state.confM&&state.confM[mid])||(state.confD&&state.confD[d]));
  const getAvail=(mid,d)=>(state.availFrom&&state.availFrom[mid]&&state.availFrom[mid][d])||'';
  const currentTimes=state.times||{};

  const missing=[];
  days.forEach(x=>members.forEach(m=>{
    if(isIn(x.d,m.id)&&isConf(x.d,m.id)&&!m.employee&&!currentTimes[`${m.id}-${x.d}`])missing.push(`${x.d}日 ${m.name}`);
  }));
  if(missing.length)return {error:`確定済みの勤務時間が未入力です：${missing.slice(0,5).join('、')}${missing.length>5?' ほか':''}。先に勤務時間を入力してください。`};

  const employeeTimes={},employeeSlots={},infos=[];
  const targetBand={weekday:{},weekend:{}},targetExact={weekday:{},weekend:{}};
  const ensureTarget=(pool,mid)=>{
    if(!targetBand[pool][mid])targetBand[pool][mid]={first:0,second:0};
    if(!targetExact[pool][mid])targetExact[pool][mid]={};
  };
  members.forEach(m=>{ensureTarget('weekday',m.id);ensureTarget('weekend',m.id);});

  days.forEach(x=>{
    const adopted=members.filter(m=>isIn(x.d,m.id));
    const employees=adopted.filter(m=>m.employee);
    const regulars=adopted.filter(m=>!m.employee);
    const fullSlots=workSlotsForDay(state,x);
    const remainingAfterEmployees=[...fullSlots];

    employees.forEach(m=>{
      const key=`${m.id}-${x.d}`;
      employeeTimes[key]='13:00';
      employeeSlots[key]=remainingAfterEmployees.length?remainingAfterEmployees.shift():(fullSlots[fullSlots.length-1]||'');
    });

    let planned=[...remainingAfterEmployees];
    if(regulars.length<planned.length)planned=planned.slice(0,regulars.length);
    while(planned.length<regulars.length)planned.push(fullSlots[fullSlots.length-1]);

    const pool=fairnessPool(x);
    regulars.forEach(m=>{
      ensureTarget(pool,m.id);
      if(!planned.length)return;
      const bandCounts={first:0,second:0},exactCounts={};
      planned.forEach(slot=>{
        bandCounts[fairnessBand(pool,slot)]++;
        exactCounts[slot]=(exactCounts[slot]||0)+1;
      });
      targetBand[pool][m.id].first+=bandCounts.first/planned.length;
      targetBand[pool][m.id].second+=bandCounts.second/planned.length;
      Object.keys(exactCounts).forEach(slot=>{
        targetExact[pool][m.id][slot]=(targetExact[pool][m.id][slot]||0)+exactCounts[slot]/planned.length;
      });
    });

    const candidates=regulars.map(m=>{
      const key=`${m.id}-${x.d}`;
      const keep=mode==='remaining'?!!currentTimes[key]:(isConf(x.d,m.id)&&!!currentTimes[key]);
      return {mid:m.id,fixedTime:keep?currentTimes[key]:''};
    });
    infos.push({day:x,pool,slots:planned,candidates,employees});
  });

  const emptyHistory=()=>{
    const band={weekday:{},weekend:{}},exact={weekday:{},weekend:{}};
    members.forEach(m=>{
      band.weekday[m.id]={first:0,second:0};band.weekend[m.id]={first:0,second:0};
      exact.weekday[m.id]={};exact.weekend[m.id]={};
    });
    return {band,exact};
  };
  const cloneHistory=(h)=>{
    const band={weekday:{},weekend:{}},exact={weekday:{},weekend:{}};
    ['weekday','weekend'].forEach(pool=>members.forEach(m=>{
      band[pool][m.id]={...h.band[pool][m.id]};
      exact[pool][m.id]={...h.exact[pool][m.id]};
    }));
    return {band,exact};
  };
  const blankHistory=emptyHistory();
  let best=null,bestScore=null;

  for(let trial=0;trial<300;trial++){
    const times={...employeeTimes},timeSlots={...employeeSlots};
    const history=cloneHistory(blankHistory);
    let delayTotal=0;
    const startsByDay={};
    infos.forEach(info=>{startsByDay[info.day.d]=info.employees.map(()=>13*60);});
    const order=[...infos].sort(()=>Math.random()-.5);
    order.forEach(info=>{
      const available=info.candidates.map(c=>({...c}));
      info.slots.forEach(slot=>{
        if(!available.length)return;
        const pool=info.pool,bandName=fairnessBand(pool,slot),slotMin=timeToMinutes(slot);
        const ranked=available.map(candidate=>{
          const av=getAvail(candidate.mid,info.day.d);
          const actualMin=candidate.fixedTime?timeToMinutes(candidate.fixedTime):Math.max(slotMin,av?timeToMinutes(av):slotMin);
          const delay=actualMin-slotMin;
          const bandDef=(targetBand[pool][candidate.mid][bandName]||0)-history.band[pool][candidate.mid][bandName];
          const exactDef=(targetExact[pool][candidate.mid][slot]||0)-(history.exact[pool][candidate.mid][slot]||0);
          return {...candidate,actualMin,delay,bandDef,exactDef,tie:Math.random()};
        }).sort((a,b)=>
          ((a.delay>0)-(b.delay>0))||(a.delay-b.delay)||(b.bandDef-a.bandDef)||(b.exactDef-a.exactDef)||(a.tie-b.tie)
        );
        const pick=ranked[0],key=`${pick.mid}-${info.day.d}`;
        times[key]=pick.fixedTime||minutesToTime(pick.actualMin);
        timeSlots[key]=slot;
        delayTotal+=Math.max(0,pick.delay);
        startsByDay[info.day.d].push(pick.actualMin);
        history.band[pool][pick.mid][bandName]++;
        history.exact[pool][pick.mid][slot]=(history.exact[pool][pick.mid][slot]||0)+1;
        available.splice(available.findIndex(c=>c.mid===pick.mid),1);
      });
    });

    let deadlineShortfall=0,bandDev=0,exactDev=0;
    infos.forEach(info=>{
      let required=0;
      const rows=[...workPlanForDay(state,info.day)].sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
      rows.forEach((row,index)=>{
        required+=row.count;
        const present=(startsByDay[info.day.d]||[]).filter(t=>t<=timeToMinutes(row.time)).length;
        deadlineShortfall+=Math.max(0,required-present)*(rows.length-index);
      });
    });
    ['weekday','weekend'].forEach(pool=>members.filter(m=>!m.employee).forEach(m=>{
      ['first','second'].forEach(b=>bandDev+=Math.abs(history.band[pool][m.id][b]-(targetBand[pool][m.id][b]||0)));
      const keys=new Set([...Object.keys(history.exact[pool][m.id]),...Object.keys(targetExact[pool][m.id])]);
      keys.forEach(slot=>exactDev+=Math.abs((history.exact[pool][m.id][slot]||0)-(targetExact[pool][m.id][slot]||0)));
    }));
    const score=[deadlineShortfall,delayTotal,bandDev,exactDev];
    if(best===null||lexLess(score,bestScore)){best={times,timeSlots};bestScore=score;}
  }
  return best||{times:employeeTimes,timeSlots:employeeSlots};
}

  const setPlanTime=(type,index,value)=>{
    if(!value||timeToMinutes(value)<15*60){setPlanMsg({ok:false,text:'募集時刻は15:00以降にしてください。'});return;}
    if(s.workPlans[type].some((row,i)=>i!==index&&row.time===value)){setPlanMsg({ok:false,text:`${PLAN_LABELS[type]}の${value}はすでに登録されています。`});return;}
    const rows=s.workPlans[type].map((row,i)=>i===index?{...row,time:value}:row).sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
    updateWorkPlans({...s.workPlans,[type]:rows});
  };
  const setPlanCount=(type,index,value)=>{
    const count=Math.max(1,parseInt(value)||1);
    updateWorkPlans({...s.workPlans,[type]:s.workPlans[type].map((row,i)=>i===index?{...row,count}:row)});
  };
  const addPlanTime=(type)=>{
    const used=new Set(s.workPlans[type].map(row=>row.time));
    const all=[];for(let t=15*60;t<24*60;t+=15)all.push(minutesToTime(t));
    const latest=Math.max(...s.workPlans[type].map(row=>timeToMinutes(row.time)));
    const value=all.find(time=>timeToMinutes(time)>latest&&!used.has(time))||all.find(time=>!used.has(time));
    if(!value){setPlanMsg({ok:false,text:`${PLAN_LABELS[type]}にはこれ以上時刻を追加できません。`});return;}
    const rows=[...s.workPlans[type],{time:value,count:1}].sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
    updateWorkPlans({...s.workPlans,[type]:rows});
  };
  const removePlanTime=(type,index)=>{
    if(s.workPlans[type].length<=1){setPlanMsg({ok:false,text:`${PLAN_LABELS[type]}には最低1つの募集時刻が必要です。`});return;}
    updateWorkPlans({...s.workPlans,[type]:s.workPlans[type].filter((_,i)=>i!==index)});
  };
  const getDemandForDay=(x)=>workPlanTotal(workPlanForDay(s,x));

  const confirmedSnapshot=()=>{
    const placed={},times={},timeSlots={};
    days.forEach(x=>{
      s.members.forEach(m=>{
        if(!isConf(x.d,m.id)||!isIn(x.d,m.id))return;
        if(!placed[x.d])placed[x.d]={};
        placed[x.d][m.id]=true;
        const key=`${m.id}-${x.d}`;
        if(Object.prototype.hasOwnProperty.call(s.times||{},key))times[key]=s.times[key];
        if(Object.prototype.hasOwnProperty.call(s.timeSlots||{},key))timeSlots[key]=s.timeSlots[key];
      });
    });
    return {placed,times,timeSlots};
  };
  const timesForPlacement=(placed,times,timeSlots)=>{
    const nextTimes={},nextSlots={};
    days.forEach(x=>s.members.forEach(m=>{
      if(!(placed[x.d]&&placed[x.d][m.id]))return;
      const key=`${m.id}-${x.d}`;
      if(m.employee)nextTimes[key]='13:00';
      else if(times&&times[key])nextTimes[key]=times[key];
      if(timeSlots&&timeSlots[key])nextSlots[key]=timeSlots[key];
    }));
    return {times:nextTimes,timeSlots:nextSlots};
  };
  const runFill=()=>{
    const error=validateWorkPlans(s.workPlans);
    if(error){setPlanMsg({ok:false,text:error});return;}
    const placed=autoFillBest(s,300);
    set({placed,...timesForPlacement(placed,s.times,s.timeSlots),staffPlanRevision:s.planRevision||0});
  };
  const runFillUnconfirmed=()=>{
    const error=validateWorkPlans(s.workPlans);
    if(error){setPlanMsg({ok:false,text:error});return;}
    if(!window.confirm('確定済みの採用・勤務時間を残し、未確定部分を自動で作り直します。よろしいですか？'))return;
    const kept=confirmedSnapshot();
    const placed=autoFillBest({...s,placed:kept.placed,times:kept.times},300);
    set({placed,...timesForPlacement(placed,kept.times,kept.timeSlots),specialApplied:{},staffPlanRevision:s.planRevision||0});
    setShareCode('');
    setConfOpen(false);
    setDayPop(null);
  };
  const clearAll=()=>{
    if(!window.confirm('採用結果・勤務時間・人/日の確定をすべて消します。希望入力（◯△×・希望時間）は残ります。よろしいですか？'))return;
    set({placed:{},confM:{},confD:{},times:{},timeSlots:{},specialApplied:{}});
    setShareCode('');
    setConfOpen(false);
    setDayPop(null);
  };
  const clearUnconfirmed=()=>{
    if(!window.confirm('確定済みの採用・勤務時間だけを残し、それ以外をすべて消します。よろしいですか？'))return;
    const kept=confirmedSnapshot();
    set({placed:kept.placed,...timesForPlacement(kept.placed,kept.times,kept.timeSlots),specialApplied:{}});
    setShareCode('');
    setConfOpen(false);
    setDayPop(null);
  };
  const runWorkTimeFill=(mode)=>{
    if(mode==='unconfirmed'&&!window.confirm('確定済みの勤務時間と社員の13:00を残し、未確定の勤務時間を割り当て直します。よろしいですか？'))return;
    const result=assignWorkTimes(s,mode);
    if(result.error){setTimeMsg({ok:false,text:result.error});return;}
    set({times:result.times,timeSlots:result.timeSlots,timePlanRevision:s.planRevision||0});
    setTimeMsg({ok:true,text:mode==='remaining'?'空欄の勤務時間を割り当てました。入力済みの時間は変更していません。':'確定以外の勤務時間を割り当て直しました。'});
    setShareCode('');
  };

  const isIn=(d,mid)=>!!(s.placed[d]&&s.placed[d][mid]);
  const toggleAssign=(d,mid)=>{
    if(isConf(d,mid))return;
    const dm={...(s.placed[d]||{})},times={...(s.times||{})},timeSlots={...(s.timeSlots||{})},sa={...((s.specialApplied&&s.specialApplied[mid])||{})};
    const key=`${mid}-${d}`,member=s.members.find(m=>m.id===mid);
    if(dm[mid]){delete dm[mid];delete times[key];delete timeSlots[key];delete sa[d];}
    else{dm[mid]=true;if(member&&member.employee)times[key]='13:00';}
    set({placed:{...s.placed,[d]:dm},times,timeSlots,specialApplied:{...(s.specialApplied||{}),[mid]:sa}});
  };
  const setTime=(mid,d,v)=>{
    if(isConf(d,mid))return;
    const key=`${mid}-${d}`,timeSlots={...(s.timeSlots||{})};
    delete timeSlots[key];
    set({times:{...(s.times||{}),[key]:v},timeSlots});
  };
  const setAvail=(mid,d,v)=>set({availFrom:{...(s.availFrom||{}),[mid]:{...((s.availFrom&&s.availFrom[mid])||{}),[d]:v}}});
  const prefClass=(p)=>p==='◎'?'pref-double':p==='◯'?'pref-maru':p==='△'?'pref-sankaku':'pref-batsu';

  const getAvail=(mid,d)=>(s.availFrom&&s.availFrom[mid]&&s.availFrom[mid][d])||'';
  const isConf=(d,mid)=>!!((s.confM&&s.confM[mid])||(s.confD&&s.confD[d]));
  const toggleConfM=(mid)=>{const cm={...(s.confM||{})};if(cm[mid])delete cm[mid];else cm[mid]=true;set({confM:cm});};
  const setConfD=(d,val)=>{const cd={...(s.confD||{})};if(val)cd[d]=true;else delete cd[d];set({confD:cd});};
  const confAll=()=>{const cm={};s.members.forEach(m=>cm[m.id]=true);set({confM:cm});};
  const clearConf=()=>{if(window.confirm('すべての確定（人・日）を解除します。よろしいですか？'))set({confM:{},confD:{}});};
  const openDayPop=(e,d)=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();let left=r.left;if(left+170>window.innerWidth-8)left=window.innerWidth-178;if(left<8)left=8;let top=r.bottom+6;if(top+96>window.innerHeight-8)top=Math.max(8,r.top-100);setDayPop({d,top,left});};
  const openMemPop=(e,mid)=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();let left=r.left;if(left+220>window.innerWidth-8)left=window.innerWidth-228;if(left<8)left=8;let top=r.bottom+6;if(top+210>window.innerHeight-8)top=Math.max(8,r.top-214);setMemPop({mid,top,left});};

  // ===== 管理者モード：提出コードの取り込み =====
  const importCode=()=>{
    const obj=decodeSubmission(importText);
    if(!obj||obj.t!=='shift-pref'){setImportMsg({ok:false,text:'コードを読み取れませんでした。貼り付け内容を確認してください。'});return;}
    const codeYear=parseInt(obj.y),codeMonth=parseInt(obj.m);
    if(codeYear!==s.year||codeMonth!==s.month){
      const text=`この提出コードは ${codeYear||'不明'}年${codeMonth||'不明'}月分です。現在の管理画面は ${s.year}年${s.month}月分のため、取り込みを中止しました。`;
      window.alert(text);setImportMsg({ok:false,text});return;
    }
    const name=String(obj.name||'').trim();
    if(!name){setImportMsg({ok:false,text:'名前が入っていないため、取り込みを中止しました。'});return;}
    const rawPrefs=obj.p&&typeof obj.p==='object'?{...obj.p}:{};const must=Array.isArray(obj.must)?obj.must.map(d=>Number(d)):[];
    Object.keys(rawPrefs).forEach(d=>{if(rawPrefs[d]==='◎'){rawPrefs[d]='◯';must.push(parseInt(d));}});
    const invalidMust=must.some(d=>!Number.isInteger(d)||d<1||d>dim);
    if(invalidMust){setImportMsg({ok:false,text:'特別勤務希望日に対象月以外の日付が含まれているため、取り込みを中止しました。提出者にコードの作り直しを依頼してください。'});return;}
    const mustDays=[...new Set(must)].filter(d=>Number.isInteger(d)&&d>=1&&d<=dim);
    const badPref=Object.keys(rawPrefs).some(d=>!['◯','△','×'].includes(rawPrefs[d]));
    if(badPref||mustDays.some(d=>rawPrefs[d]!=='◯')){setImportMsg({ok:false,text:'特別勤務希望日と通常希望が一致していないため、取り込みを中止しました。提出者にコードの作り直しを依頼してください。'});return;}
    let mid,members=s.members,added=false;
    const exist=members.find(x=>x.name===name);
    if(exist){mid=exist.id;members=members.map(x=>x.id===mid?{...x,noConsec:obj.nc||0,maxDays:obj.md||0,employee:!!obj.e}:x);}
    else{mid=uid();members=[...members,{id:mid,name,noConsec:obj.nc||0,maxDays:obj.md||0,employee:!!obj.e}];added=true;}
    const newPrefs={...s.prefs,[mid]:rawPrefs};
    const newAvail={...(s.availFrom||{}),[mid]:{...(obj.a||{})}};
    const times={...(s.times||{})},timeSlots={...(s.timeSlots||{})},placed={...(s.placed||{})};
    const oldApplied=(s.specialApplied&&s.specialApplied[mid])||{};
    Object.keys(oldApplied).forEach(raw=>{const d=parseInt(raw),dm={...(placed[d]||{})};delete dm[mid];delete times[`${mid}-${d}`];delete timeSlots[`${mid}-${d}`];placed[d]=dm;});
    const specialMap={},appliedMap={};mustDays.forEach(d=>{specialMap[d]=true;appliedMap[d]=true;placed[d]={...(placed[d]||{}),[mid]:true};if(obj.e){times[`${mid}-${d}`]='13:00';delete timeSlots[`${mid}-${d}`];}});
    const specialPrefs={...(s.specialPrefs||{}),[mid]:specialMap},specialApplied={...(s.specialApplied||{}),[mid]:appliedMap};
    if(obj.e)days.forEach(x=>{if(placed[x.d]&&placed[x.d][mid]){times[`${mid}-${x.d}`]='13:00';delete timeSlots[`${mid}-${x.d}`];}});
    set({members,prefs:newPrefs,availFrom:newAvail,placed,times,timeSlots,specialPrefs,specialApplied});
    setImportMsg({ok:true,text:`${name} さんの希望を${added?'新規に追加':'上書き反映'}しました。${mustDays.length?` 特別勤務希望日${mustDays.length}日分には採用◯を付けました。`:''}`});
    setImportText('');
  };

  // ===== 配布用：共有コード（LZString圧縮）を生成 =====
  const buildShare=()=>{
    if(!s.members.length)return;
    if(s.members.length>PACK_CHARS.length){alert('QRコード用の短縮共有は64人まで対応しています。メンバー数を減らしてから作成してください。');return;}
    const idx={};s.members.forEach((m,i)=>{idx[m.id]=i;});
    const C={z:3,y:s.year,m:s.month,n:s.members.map(m=>m.name),a:[],t:[],p:[],v:[],d:'',h:days.filter(x=>x.holiday).map(x=>x.d)};
    C.d=days.map(x=>packSmall(getDemandForDay(x))).join('');
    days.forEach(x=>{
      const ins=s.members.filter(m=>isIn(x.d,m.id)).map(m=>idx[m.id]);
      C.a[x.d-1]=ins.map(packSmall).join('');
    });
    s.members.forEach(m=>{
      const i=idx[m.id];
      const pref=days.map(x=>packSharePref(getPref(m.id,x.d))).join('').replace(/0+$/,'');
      C.p[i]=pref;
      const avs=[],wts=[];
      days.forEach(x=>{
        const a=getAvail(m.id,x.d);
        if(a)avs.push(packShareDayTime(x.d,a));
        if(isIn(x.d,m.id)){
          const t=(s.times||{})[m.id+'-'+x.d];
          if(t)wts.push(packShareDayTime(x.d,t));
        }
      });
      if(avs.length)C.v[i]=avs.join('');
      if(wts.length)C.t[i]=wts.join('');
    });
    setShareCode(LZString.compressToEncodedURIComponent(JSON.stringify(C)));
  };
  const copyText=(t)=>{if(navigator.clipboard&&t)navigator.clipboard.writeText(t);};
  const shareLink=()=>{const u=(viewerUrl||'').trim();if(!u||!shareCode)return '';return u+(u.indexOf('#')>=0?'':'#')+encodeURIComponent(shareCode);};
  const rawShareLink=()=>{const u=(viewerUrl||'').trim();if(!u||!shareCode)return '';return u+(u.indexOf('#')>=0?'':'#')+shareCode;};
  useEffect(()=>{
    setQrReady(false);
    setQrMsg('');
    if(qrPhotoUrlRef.current){URL.revokeObjectURL(qrPhotoUrlRef.current);qrPhotoUrlRef.current='';}
    setQrPhotoUrl('');
    const el=qrRef.current;
    if(!el)return;
    el.innerHTML='';
    const link=rawShareLink();
    if(!link)return;
    if(typeof window.QRCode==='undefined'){
      setQrMsg('QRコード生成ライブラリを読み込めませんでした。通信状態を確認して、画面を再読み込みしてください。');
      return;
    }
    try{
      new window.QRCode(el,{
        text:link,
        width:220,
        height:220,
        colorDark:'#000000',
        colorLight:'#ffffff',
        correctLevel:window.QRCode.CorrectLevel.L
      });
      setQrReady(true);
      if(link.length>2400)setQrMsg('URLがかなり長いため、QRコードが細かくなっています。読み取りづらい場合はリンクをコピーして送ってください。');
    }catch(e){
      setQrMsg('URLが長すぎるため、QRコードを作成できませんでした。共有リンクまたは共有コードを使ってください。');
    }
  },[shareCode,viewerUrl]);
  const saveQrPng=()=>{
    const box=qrRef.current;
    const src=box&&(box.querySelector('canvas')||box.querySelector('img'));
    if(!src){setQrMsg('先に共有コード／リンク／QRコードを作成してください。');return;}
    const out=document.createElement('canvas');
    const size=1024,pad=96,qrSize=size-pad*2;
    out.width=size;out.height=size;
    const ctx=out.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,size,size);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(src,pad,pad,qrSize,qrSize);
    const fileName=`shift-qr-${s.year}-${String(s.month).padStart(2,'0')}.png`;
    const finish=(blob)=>{
      if(!blob){setQrMsg('QR画像を作成できませんでした。別のブラウザでもう一度試してください。');return;}
      if(qrPhotoUrlRef.current)URL.revokeObjectURL(qrPhotoUrlRef.current);
      const url=URL.createObjectURL(blob);
      qrPhotoUrlRef.current=url;
      setQrPhotoUrl(url);
      setQrMsg('QR画像を作成しました。保存されない場合は、下のリンクから画像を開いて保存してください。');
      const a=document.createElement('a');
      a.href=url;
      a.download=fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
    if(out.toBlob)out.toBlob(finish,'image/png');
    else finish(null);
  };

  // 連勤違反チェック（手動調整後の最終結果を検査）
  const consecViolation=(mid)=>{const m=s.members.find(x=>x.id===mid);const N=m&&m.noConsec?m.noConsec:0;if(!N)return false;let run=0;for(let d=1;d<=dim;d++){run=isIn(d,mid)?run+1:0;if(run>=N)return true;}return false;};
  // 採用日数（手動反映後）
  const adoptedCount=(mid,poolFilter)=>days.filter(x=>{if(poolFilter==='weekday'&&x.we)return false;if(poolFilter==='weekend'&&!x.we)return false;return isIn(x.d,mid);}).length;

  // カレンダー週組み（月曜始まり）
  const weeks=useMemo(()=>{
    const first=new Date(s.year,s.month-1,1).getDay();
    const offset=first; // 日=0
    const cells=[];for(let i=0;i<offset;i++)cells.push(null);
    days.forEach(x=>cells.push(x));
    while(cells.length%7!==0)cells.push(null);
    const w=[];for(let i=0;i<cells.length;i+=7)w.push(cells.slice(i,i+7));
    return w;
  },[s.year,s.month,days]);
  const staffPlanOutdated=(s.staffPlanRevision||0)!==(s.planRevision||0);
  const timePlanOutdated=(s.timePlanRevision||0)!==(s.planRevision||0);
  const specialOverflow=days.map(x=>{
    const count=s.members.filter(m=>isSpecial(m.id,x.d)).length;
    const demand=getDemandForDay(x);
    return count>demand?{d:x.d,count,demand}:null;
  }).filter(Boolean);

  return (
    <div className="wrap">
      <h1><span className="dot"></span>シフトメーカー<span style={{fontSize:14,color:'var(--muted)',fontWeight:400,marginLeft:6}}>管理者用</span></h1>
      <div className="sub">希望を集めて、平日／金土日祝を分けて平等に自動割り当て。連勤制約つき・後から手で直せます。</div>

      {/* 1 基本設定 */}
      <div className="card">
        <h2><span className="num">1</span>基本設定</h2>
        <div className="row">
          <label className="fl">年<input type="number" value={s.year} onChange={e=>set({year:parseInt(e.target.value)||s.year})}/></label>
          <label className="fl">月<select value={s.month} onChange={e=>set({month:parseInt(e.target.value)})}>{Array.from({length:12},(_,i)=>i+1).map(m=><option key={m} value={m}>{m}月</option>)}</select></label>
        </div>
        <div className="plan-grid">
          {PLAN_TYPES.map(type=>(
            <section className="plan-block" key={type}>
              <div className="plan-head">
                <div className="plan-title">{PLAN_LABELS[type]}</div>
                <div className="plan-total">合計 {workPlanTotal(s.workPlans[type])}名</div>
              </div>
              {s.workPlans[type].map((row,index)=>(
                <div className="plan-row" key={row.time}>
                  <TimePicker value={row.time} minHour={15} allowClear={false} onChange={value=>setPlanTime(type,index,value)}/>
                  <input className="plan-count" type="number" min="1" value={row.count} aria-label={`${PLAN_LABELS[type]} ${row.time}の人数`} onChange={e=>setPlanCount(type,index,e.target.value)}/>
                  <button className="plan-del" disabled={s.workPlans[type].length<=1} onClick={()=>removePlanTime(type,index)} title="この時刻を削除">×</button>
                </div>
              ))}
              <button className="plan-add" onClick={()=>addPlanTime(type)}>＋ 時間を追加</button>
            </section>
          ))}
        </div>
        <div className="hint">各時間の人数合計が、その曜日区分の募集人数になります。時刻は15分刻み・15:00以降。同じ区分に同じ時刻は登録できません。</div>
        {planMsg&&<div className={"imp-msg "+(planMsg.ok?'imp-ok':'imp-ng')}>{planMsg.text}</div>}
        {(staffPlanOutdated||timePlanOutdated)&&<div className="plan-note">設定変更は既存シフトへ自動反映されません。{staffPlanOutdated?'勤務者は「確定以外を自動作成」、':''}{timePlanOutdated?'勤務時間は「確定以外の出勤時間を自動割り当て」':''}で新設定から組み直せます。</div>}
      </div>

      {/* 希望の取り込み */}
      <div className="card">
        <h2><span className="num">＋</span>提出コードを取り込む</h2>
        <div className="hint" style={{marginTop:0,marginBottom:8}}>バイトから送られてきた提出コードを貼り付けて取り込みます。同じ名前は上書き、未登録の名前は自動で追加されます。</div>
        <div className="row" style={{alignItems:'stretch'}}>
          <input value={importText} placeholder="提出コードを貼り付け" onChange={e=>setImportText(e.target.value)} style={{flex:'1 1 320px'}}/>
          <button className="btn accent" onClick={importCode}>取り込む</button>
        </div>
        {importMsg&&<div className={"imp-msg "+(importMsg.ok?'imp-ok':'imp-ng')}>{importMsg.text}</div>}
      </div>

      {/* 2 メンバー */}
      <div className="card">
        <h2><span className="num">2</span>メンバー <span style={{fontSize:11,fontWeight:400,color:'var(--muted)'}}>／ 連勤禁止：「3」で3連勤を禁止（＝最大2連勤）。最大勤務：月の上限日数。どちらも空欄（—）＝制限なし</span></h2>
        <div className="row" style={{gap:8}}>
          {s.members.map(m=>(
            <span className="member-tag" key={m.id}>
              <span className="nm">{m.name}</span>
              {m.employee&&<span className="emp">社員</span>}
              <button className="rename" onClick={e=>openMemPop(e,m.id)} title="名前を編集">名前編集</button>
              <span className="consec"><input type="number" min="0" value={m.noConsec||''} placeholder="—" onChange={e=>setConsec(m.id,e.target.value)}/>連勤禁止</span>
              <span className="consec"><input type="number" min="0" value={m.maxDays||''} placeholder="—" onChange={e=>setMaxDays(m.id,e.target.value)}/>最大勤務</span>
              <button className="del" onClick={()=>delMember(m.id)} title="削除">×</button>
            </span>
          ))}
          <input value={newName} placeholder="名前を入力" onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addMember();}} style={{width:120}}/>
          <button className="btn sm accent" onClick={addMember}>＋ 追加</button>
          <button className="btn sm ghost" onClick={delAllMembers} disabled={!s.members.length}>メンバーを一括削除</button>
        </div>
        <div className="hint">削除すると、そのメンバーの希望・希望時間・特別勤務希望日・採用・勤務時間・確定情報もすべて削除されます。</div>
      </div>

      {/* 3 希望入力 */}
      <div className="card">
        <h2><span className="num">3</span>希望入力</h2>
        <div className="legend" style={{marginBottom:8}}>
          <span><b className="pref-maru" style={{padding:'1px 6px',borderRadius:4}}>◯</b> 可能(1.0)</span>
          <span><b className="pref-double" style={{padding:'1px 6px',borderRadius:4}}>◎</b> 特別勤務希望日(1.0)</span>
          <span><b className="pref-sankaku" style={{padding:'1px 6px',borderRadius:4}}>△</b> 他にいなければ可(0.5)</span>
          <span><b className="pref-batsu" style={{padding:'1px 6px',borderRadius:4}}>×</b> 不可</span>
          <span style={{marginLeft:4}}>セルをタップで ×→◯→△→× 切替</span>
        </div>
        <div className="grid-scroll">
          <table>
            <thead><tr><th className="namecol">メンバー</th>{days.map(x=><th key={x.d} className={"dayhead"+(x.we?" we":"")} title={x.holiday||''}>{x.d}<small>{WD[x.dow]}{x.holiday?'（祝）':''}</small></th>)}</tr></thead>
            <tbody>
              <tr>
                <td className="namecol" style={{color:'var(--muted)',fontSize:12}}>募集人数</td>
                {days.map(x=><td key={x.d} style={{background:'#faf7f0'}}><span className="demand-value">{getDemandForDay(x)}</span></td>)}
              </tr>
              {s.members.map(m=>(
                <tr key={m.id}>
                  <td className="namecol"><span className="mem-name" onClick={e=>openMemPop(e,m.id)} title="タップで連勤禁止・最大勤務日数を編集">{m.name}</span>
                    <div style={{marginTop:2,display:'flex',gap:3,alignItems:'center',flexWrap:'wrap'}}>
                      <button className="btn sm ghost" style={{padding:'1px 5px',fontSize:10}} onClick={()=>moveMember(m.id,-1)} title="上へ">▲</button>
                      <button className="btn sm ghost" style={{padding:'1px 5px',fontSize:10}} onClick={()=>moveMember(m.id,1)} title="下へ">▼</button>
                      <button className="btn sm ghost" style={{padding:'1px 6px',fontSize:10}} onClick={()=>fillRow(m.id,'◯')}>全◯</button>{' '}
                      <button className="btn sm ghost" style={{padding:'1px 6px',fontSize:10}} onClick={()=>fillRow(m.id,'×')}>全×</button>
                    </div>
                  </td>
                  {days.map(x=>{const p=shownPref(m.id,x.d);return <td key={x.d} className={"pref-cell "+prefClass(p)}><div className="pcell-mark" onClick={()=>cyclePref(m.id,x.d)}>{p}</div>{p!=='×'&&<div className="pcell-time"><TimePicker value={getAvail(m.id,x.d)} onChange={v=>setAvail(m.id,x.d,v)} suffix="〜"/></div>}</td>;})}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {memPop&&(()=>{const mm=s.members.find(x=>x.id===memPop.mid);if(!mm)return null;return (<>
        <div className="tp-ov" onClick={()=>setMemPop(null)}></div>
        <div className="tp-pop" style={{top:memPop.top,left:memPop.left,width:'auto',padding:14}}>
          <div className="tp-ttl">{mm.name} の設定</div>
          <div style={{display:'flex',flexDirection:'column',gap:8,minWidth:160}}>
            <label className="mp-row">名前<input type="text" value={mm.name} onChange={e=>setMemberName(mm.id,e.target.value)} onBlur={e=>setMemberName(mm.id,e.target.value.trim()||'名前未設定')}/></label>
            <label className="mp-row">社員<input type="checkbox" checked={!!mm.employee} onChange={e=>setEmployee(mm.id,e.target.checked)} style={{width:18,height:18}}/></label>
            <label className="mp-row">連勤禁止<input type="number" min="0" value={mm.noConsec||''} placeholder="—" onChange={e=>setConsec(mm.id,e.target.value)}/></label>
            <label className="mp-row">最大勤務日数<input type="number" min="0" value={mm.maxDays||''} placeholder="—" onChange={e=>setMaxDays(mm.id,e.target.value)}/></label>
            <div style={{fontSize:10,color:'var(--muted)'}}>どちらも 空欄(—)＝制限なし</div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}><button className="btn accent sm" onClick={()=>setMemPop(null)}>閉じる</button></div>
        </div>
      </>);})()}

      {/* 4 シフト作成 */}
      <div className="card shift-card">
        <div className="shift-title-row">
          <h2><span className="num">4</span>シフト作成 <span style={{fontSize:11,fontWeight:400,color:'var(--muted)'}}>／ マスをタップで採用◯を付け外し・時刻もタップ</span></h2>
          {specialOverflow.length>0&&<div className="special-overflow">{specialOverflow.map(x=><div key={x.d}>⚠ {s.month}月{x.d}日は◎希望が定員を超過しています（◎{x.count}名／募集{x.demand}名）</div>)}</div>}
        </div>
        <div className="toolbar">
          <div className="fill-stack">
            <button className="btn accent" onClick={runFill} disabled={!s.members.length}>残りを自動で作成 ▶</button>
            <button className="btn accent sm" onClick={runFillUnconfirmed} disabled={!s.members.length}>確定以外を自動作成</button>
          </div>
          <div className="clear-stack">
            <button className="btn ghost sm" onClick={clearAll} disabled={!s.members.length}>全部クリア</button>
            <button className="btn ghost sm" onClick={clearUnconfirmed} disabled={!s.members.length}>確定以外を全部クリア</button>
          </div>
          <div className="time-stack">
            <button className="btn accent sm" onClick={()=>runWorkTimeFill('remaining')} disabled={!s.members.length}>残りの出勤時間を自動割り当て</button>
            <button className="btn accent sm" onClick={()=>runWorkTimeFill('unconfirmed')} disabled={!s.members.length}>確定以外の出勤時間を自動割り当て</button>
          </div>
          <dl className="shift-guide" aria-label="出勤時間の目安">
            {PLAN_TYPES.map(type=><React.Fragment key={type}><dt>{PLAN_LABELS[type].replace('（月〜木）','')}</dt><dd>{formatWorkPlan(s.workPlans[type])}</dd></React.Fragment>)}
          </dl>
          <span className="cf-wrap" style={{marginLeft:'auto'}}>
            <button className="btn ghost sm" onClick={()=>setConfOpen(o=>!o)} disabled={!s.members.length}>確定 {confOpen?'▲':'▼'}</button>
            {confOpen&&(
              <div className="cf-panel">
                <div className="cf-row allrow"><button className="btn sm ghost" style={{padding:'2px 7px',fontSize:11}} onClick={confAll}>全員確定</button><button className="btn sm ghost" style={{padding:'2px 7px',fontSize:11}} onClick={clearConf}>全解除</button></div>
                {s.members.map(m=>{const on=!!(s.confM&&s.confM[m.id]);return <div key={m.id} className="cf-row" onClick={()=>toggleConfM(m.id)}><input type="checkbox" readOnly checked={on}/>{m.name}</div>;})}
                <div style={{fontSize:11,color:'var(--muted)',padding:'4px 8px'}}>日付の確定はカレンダーの日付をタップ</div>
              </div>
            )}
          </span>
          <label className="fl" style={{flexDirection:'row',alignItems:'center',gap:8}}>
            <span>絞り込み:</span>
            <select value={filter} onChange={e=>setFilter(e.target.value)}>
              <option value="all">全員</option>
              {s.members.map(m=><option key={m.id} value={m.id}>{m.name} のみ</option>)}
            </select>
          </label>
        </div>
        <div className="hint" style={{marginTop:0,marginBottom:8}}>「残りを自動で作成」＝勤務する人を補完。「残りの出勤時間」＝入力済み時間を残して空欄だけ補完。「確定以外の出勤時間」＝確定時間を残して未確定時間を再配分。社員は13:00で最優先に必要枠を消費します。</div>
        {timeMsg&&<div className={"imp-msg "+(timeMsg.ok?'imp-ok':'imp-ng')} style={{marginBottom:8}}>{timeMsg.text}</div>}
        {!s.members.length?<div className="empty">先に「2 メンバー」と「3 希望入力」を用意してください。</div>:(<>
          <div className="cal" style={{gridTemplateColumns:'repeat(7,minmax(0,1fr))',width:'100%'}}>
            {['日','月','火','水','木','金','土'].map((w,i)=><div key={w} className={"cal-head"+(i===0||i>=5?" we":"")}>{w}</div>)}
            {weeks.map((week,wi)=>week.map((x,ci)=>{
              if(!x)return <div key={wi+'-'+ci} className="cal-cell blank"></div>;
              const def=getDemandForDay(x);
              let rows=[...s.members];
              if(filter!=='all')rows=rows.filter(m=>m.id===filter);
              const inCount=s.members.filter(m=>isIn(x.d,m.id)).length;
              return (
                <div key={x.d} className={"cal-cell"+(x.we?" we":"")}>
                  <div className={"cal-date"+(inCount<def?" short":"")}><span title={x.holiday||''}><span className="dnum" onClick={e=>openDayPop(e,x.d)}>{x.d}</span><span style={{fontSize:9,color:x.we?'var(--weekend)':'var(--muted)',marginLeft:2}}>{WD[x.dow]}{x.holiday?'（祝）':''}</span>{s.confD&&s.confD[x.d]?<span className="lk">🔒</span>:null}</span>
                    <span className="cap">{inCount}/{def}</span></div>
                  {rows.map(m=>{
                    const raw=getPref(m.id,x.d),p=shownPref(m.id,x.d);const inn=isIn(x.d,m.id);const av=getAvail(m.id,x.d);
                    const wish=raw!=='×';
                    const cc=(p==='◯'||p==='◎')?'cmaru':p==='△'?'csankaku':'cbatsu';
                    const cf=isConf(x.d,m.id);
                    return <div key={m.id} className="mini-row">
                      <span className={"mnm "+cc}>{m.name}</span>
                      <span className={"mpf "+cc+(wish?' wishfill':'')}>{p}</span>
                      <span className={"mav"+(raw!=='×'?' wishfill':'')}>{raw!=='×'&&av?av:'·'}</span>
                      <span className={"mak"+(inn?(cf?' lockfill':' workfill'):'')} onClick={e=>{e.stopPropagation();toggleAssign(x.d,m.id);}} style={{color:inn?(cf?'#3b6fb0':'var(--accent)'):'var(--line)'}}>{inn?'◯':'・'}</span>
                      <span className={"mwt"+(inn?(cf?' lockfill':' workfill'):'')}>{inn?<TimePicker value={s.times[`${m.id}-${x.d}`]||''} initialValue={av} onChange={v=>setTime(m.id,x.d,v)}/>:<span className="dim">·</span>}</span>
                    </div>;
                  })}
                </div>
              );
            }))}
          </div>
          {dayPop&&(<>
            <div className="tp-ov" onClick={()=>setDayPop(null)}></div>
            <div className="tp-pop" style={{top:dayPop.top,left:dayPop.left,width:'auto',padding:14}}>
              <div className="tp-ttl">{s.month}月{dayPop.d}日 を…</div>
              <div style={{display:'flex',gap:8,justifyContent:'center'}}>
                <button className="btn ghost sm" onClick={()=>{setConfD(dayPop.d,false);setDayPop(null);}}>未確定</button>
                <button className="btn accent sm" onClick={()=>{setConfD(dayPop.d,true);setDayPop(null);}}>確定</button>
              </div>
            </div>
          </>)}
        </>)}
      </div>

      {/* 5 個人サマリー */}
      {s.members.length>0&&(
        <div className="card">
          <h2><span className="num">5</span>個人サマリー</h2>
          <div className="scroll-x">
          <table className="sum-table">
            <thead><tr>
              <th>メンバー</th><th>エラー</th><th>連勤禁止</th><th>最大</th>
              <th>希望(平日)</th><th>希望(金土日祝)</th><th>希望合計</th>
              <th>採用(平日)</th><th>採用(金土日祝)</th><th>採用合計</th>
            </tr></thead>
            <tbody>
              {s.members.map(m=>{
                const cnt=(pool)=>{let mar=0,san=0;days.forEach(x=>{if(pool==='weekday'&&x.we)return;if(pool==='weekend'&&!x.we)return;const p=getPref(m.id,x.d);if(p==='◯')mar++;else if(p==='△')san++;});return {mar,san,wish:mar+san*0.5};};
                const rw=cnt('weekday'),re=cnt('weekend');
                const aw=adoptedCount(m.id,'weekday'),ae=adoptedCount(m.id,'weekend');
                const viol=consecViolation(m.id);
                const mviol=(m.maxDays>0)&&((aw+ae)>m.maxDays);
                const missingSpecial=days.filter(x=>isSpecial(m.id,x.d)&&!isIn(x.d,m.id)).map(x=>x.d);
                return <tr key={m.id}>
                  <td><b>{m.name}</b></td>
                  <td className="error-cell">{missingSpecial.length>0&&<div className="warn">⚠ ◎未採用：{missingSpecial.join('日、')}日</div>}{viol&&<div className="warn">⚠ 連勤違反あり</div>}{mviol&&<div className="warn">⚠ 最大勤務日数超過</div>}</td>
                  <td className="n">{m.noConsec?m.noConsec+'連勤禁止':'—'}</td>
                  <td className="n">{m.maxDays?m.maxDays+'日':'—'}</td>
                  <td className="n">{rw.wish.toFixed(1)}<div style={{fontSize:10,color:'var(--muted)'}}>◯{rw.mar} △{rw.san}</div></td>
                  <td className="n">{re.wish.toFixed(1)}<div style={{fontSize:10,color:'var(--muted)'}}>◯{re.mar} △{re.san}</div></td>
                  <td className="n big">{(rw.wish+re.wish).toFixed(1)}</td>
                  <td className="n">{aw}</td>
                  <td className="n">{ae}</td>
                  <td className="n big" style={{color:'var(--accent)'}}>{aw+ae}</td>
                </tr>;
              })}
            </tbody>
          </table>
          </div>
          <div className="hint">希望合計は ◯・◎=1.0、△=0.5 で計算。エラーは確認用の警告で、自動作成や共有を止めません。採用は今のカレンダーの状態を反映します。</div>
        </div>
      )}

      {/* 7 シフトを共有 */}
      <div className="card">
        <h2><span className="num">6</span>シフトを共有する</h2>
        <div className="hint" style={{marginTop:0,marginBottom:10}}>確定したシフト（手動調整を含む）を短縮圧縮した「共有コード」に変換します。閲覧専用ビューアの公開URLを設定しておくと、ワンタップで開ける「共有リンク」も作れます。リンクが使えない人にはコードを貼り付けてもらえばOKです。</div>
        <label className="fl" style={{marginBottom:10}}>ビューアの公開URL（自動で入っています。普段はこのままでOK）
          <input value={viewerUrl} placeholder="https://〜.netlify.app/view.html" onChange={e=>setViewerUrl(e.target.value)} style={{width:'100%',maxWidth:440}}/>
        </label>
        <div><button className="btn accent" onClick={buildShare} disabled={!s.members.length}>共有コード／リンク／QRコードを作成 ▶</button></div>
        {!s.members.length&&<div className="hint">先にメンバーを追加してください。</div>}
        {shareCode&&(
          <div style={{marginTop:12}}>
            {shareLink()?(
              <div style={{marginBottom:12}}>
                <div className="hint" style={{marginTop:0,marginBottom:6}}>① 共有リンク（これをLINEで送る・ワンタップで開けます）：</div>
                <div className="codebox">{shareLink()}</div>
                <div className="hint">リンク文字数：{shareLink().length}文字</div>
                <button className="btn sm" style={{marginTop:8}} onClick={()=>copyText(shareLink())}>リンクをコピー</button>
              </div>
            ):(
              <div className="hint" style={{marginBottom:10}}>※ 上に「ビューアの公開URL」を入れると、共有リンクも作れます（未入力なら下のコードを使用）。</div>
            )}
            <div className="hint" style={{marginTop:0,marginBottom:6}}>{shareLink()?'② ':''}共有コード（リンクが開けない人はビューアに貼り付け）：</div>
            <div className="codebox">{shareCode}</div>
            <div className="hint">コード文字数：{shareCode.length}文字</div>
            <button className="btn sm" style={{marginTop:8}} onClick={()=>copyText(shareCode)}>コードをコピー</button>
            {shareLink()&&(
              <div className="qrwrap">
                <div className="qrbox" ref={qrRef}></div>
                <div className="qrarea">
                  <div className="hint" style={{marginTop:0,marginBottom:8}}>③ QRコード（画像としてLINEで送る用）：</div>
                  <button className="btn sm" onClick={saveQrPng} disabled={!qrReady}>QR画像を保存</button>
                  <div className="qrmsg">
                    {qrMsg||'PNG画像として保存できます。読み取りづらい場合に備えて、共有リンクも一緒に送るのがおすすめです。'}
                    {qrPhotoUrl&&(
                      <>
                        <br/>
                        <a href={qrPhotoUrl} download={`shift-qr-${s.year}-${String(s.month).padStart(2,'0')}.png`} target="_blank" rel="noopener">画像を開く/保存</a>
                      </>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  render(){
    if(this.state.err){
      return (<div style={{maxWidth:560,margin:'60px auto',padding:24,background:'#fffdf8',border:'1px solid #e3ddd0',borderRadius:16,fontFamily:'sans-serif'}}>
        <h2 style={{marginBottom:10}}>表示エラーから復帰します</h2>
        <p style={{color:'#8a8378',fontSize:14,lineHeight:1.7,marginBottom:16}}>保存データが原因で表示できませんでした。下のボタンで保存をクリアして再起動してください（メンバー・希望は初期化されます）。</p>
        <button onClick={()=>{try{localStorage.removeItem('shiftmaker_v3');}catch(e){}location.reload();}}
          style={{background:'#d8602e',color:'#fff',border:'none',borderRadius:10,padding:'10px 18px',fontWeight:700,cursor:'pointer'}}>データをリセットして再起動</button>
      </div>);
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
